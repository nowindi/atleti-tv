name: Update TV schedule
on:
  schedule:
    - cron: '17 7,17 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: update-schedule
  cancel-in-progress: false
jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/app.test.cjs
      - run: python scripts/update.py
      - run: python scripts/update.py --validate
      - name: Commit updates
        run: |
          if ! git diff --quiet -- data/; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/matches.json data/history.json
            git commit -m 'chore: update Atlético calendar and evidence'
            git push origin HEAD:main
          fi
  deploy:
    needs: update
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
